<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    background-color: #eef1f6;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .calculator {
    background-color: #4fa9ff;
    border-radius: 26px;
    padding: 25px;
    width: 320px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
  }

  .display {
    background-color: #eaf3ff;
    border-radius: 12px;
    padding: 20px 18px;
    margin-bottom: 20px;
    text-align: right;
    overflow: hidden;
  }

  .display .previous {
    font-size: 14px;
    color: #5c7a99;
    min-height: 18px;
    word-wrap: break-word;
  }

  .display .current {
    font-size: 36px;
    font-weight: 700;
    color: #16233a;
    word-wrap: break-word;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  button {
    border: none;
    border-radius: 12px;
    font-size: 20px;
    font-weight: 600;
    padding: 18px 0;
    cursor: pointer;
    color: #ffffff;
    background-color: #2f7fd6;
    transition: transform 0.08s ease, filter 0.15s ease;
  }

  button:hover {
    filter: brightness(1.08);
  }

  button:active {
    transform: scale(0.95);
  }

  .btn-operator {
    background-color: #1c5eae;
  }

  .btn-function {
    background-color: #7fbcff;
    color: #16233a;
  }

  .btn-equals {
    background-color: #16233a;
    grid-row: span 2;
    height: 100%;
  }

  .btn-zero {
    grid-column: span 2;
  }

  @media (max-width: 360px) {
    .calculator {
      width: 92vw;
    }
  }
</style>
</head>
<body>

  <div class="calculator">
    <div class="display">
      <div class="previous" id="previousOperand"></div>
      <div class="current" id="currentOperand">0</div>
    </div>

    <div class="buttons">
      <button class="btn-function" data-action="clear">C</button>
      <button class="btn-function" data-action="delete">DEL</button>
      <button class="btn-function" data-action="percent">%</button>
      <button class="btn-operator" data-action="operator" data-value="/">&divide;</button>

      <button data-action="number" data-value="7">7</button>
      <button data-action="number" data-value="8">8</button>
      <button data-action="number" data-value="9">9</button>
      <button class="btn-operator" data-action="operator" data-value="*">&times;</button>

      <button data-action="number" data-value="4">4</button>
      <button data-action="number" data-value="5">5</button>
      <button data-action="number" data-value="6">6</button>
      <button class="btn-operator" data-action="operator" data-value="-">&minus;</button>

      <button data-action="number" data-value="1">1</button>
      <button data-action="number" data-value="2">2</button>
      <button data-action="number" data-value="3">3</button>
      <button class="btn-operator" data-action="operator" data-value="+">+</button>

      <button class="btn-zero" data-action="number" data-value="0">0</button>
      <button data-action="decimal">.</button>
      <button class="btn-equals" data-action="equals">=</button>
    </div>
  </div>

<script>
  const previousOperandEl = document.getElementById('previousOperand');
  const currentOperandEl = document.getElementById('currentOperand');

  let currentOperand = '0';
  let previousOperand = '';
  let operator = null;
  let shouldResetScreen = false;

  function updateDisplay() {
    currentOperandEl.textContent = currentOperand;
    previousOperandEl.textContent = previousOperand;
  }

  function appendNumber(number) {
    if (currentOperand === '0' || shouldResetScreen) {
      currentOperand = '';
      shouldResetScreen = false;
    }
    if (currentOperand.length >= 12) return;
    currentOperand += number;
  }

  function appendDecimal() {
    if (shouldResetScreen) {
      currentOperand = '0';
      shouldResetScreen = false;
    }
    if (!currentOperand.includes('.')) {
      currentOperand += '.';
    }
  }

  function chooseOperator(op) {
    if (currentOperand === '' ) return;

    if (previousOperand !== '' && !shouldResetScreen) {
      calculate();
    }

    operator = op;
    previousOperand = `${currentOperand} ${operatorSymbol(op)}`;
    shouldResetScreen = true;
  }

  function operatorSymbol(op) {
    switch (op) {
      case '/': return '\u00F7';
      case '*': return '\u00D7';
      case '-': return '\u2212';
      case '+': return '+';
      default: return op;
    }
  }

  function calculate() {
    let result;
    const prev = parseFloat(previousOperand);
    const current = parseFloat(currentOperand);

    if (isNaN(prev) || isNaN(current)) return;

    switch (operator) {
      case '+':
        result = prev + current;
        break;
      case '-':
        result = prev - current;
        break;
      case '*':
        result = prev * current;
        break;
      case '/':
        if (current === 0) {
          currentOperand = 'Error';
          previousOperand = '';
          operator = null;
          shouldResetScreen = true;
          return;
        }
        result = prev / current;
        break;
      default:
        return;
    }

    result = Math.round(result * 1e10) / 1e10;

    currentOperand = result.toString();
    previousOperand = '';
    operator = null;
    shouldResetScreen = true;
  }

  function clearAll() {
    currentOperand = '0';
    previousOperand = '';
    operator = null;
    shouldResetScreen = false;
  }

  function deleteLast() {
    if (currentOperand.length === 1 || currentOperand === 'Error') {
      currentOperand = '0';
    } else {
      currentOperand = currentOperand.slice(0, -1);
    }
  }

  function applyPercent() {
    currentOperand = (parseFloat(currentOperand) / 100).toString();
  }

  document.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => {
      const action = button.dataset.action;
      const value = button.dataset.value;

      if (action === 'number') {
        appendNumber(value);
      } else if (action === 'decimal') {
        appendDecimal();
      } else if (action === 'operator') {
        chooseOperator(value);
      } else if (action === 'equals') {
        calculate();
      } else if (action === 'clear') {
        clearAll();
      } else if (action === 'delete') {
        deleteLast();
      } else if (action === 'percent') {
        applyPercent();
      }

      updateDisplay();
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
    else if (e.key === '.') appendDecimal();
    else if (['+', '-', '*', '/'].includes(e.key)) chooseOperator(e.key);
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Backspace') deleteLast();
    else if (e.key === 'Escape') clearAll();
    else return;

    updateDisplay();
  });

  updateDisplay();
</script>

</body>
</html>
